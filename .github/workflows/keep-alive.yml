name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'  # tous les 3 jours à 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://imcretfkhclkvqiwlkwz.supabase.co/rest/v1/code_types?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
